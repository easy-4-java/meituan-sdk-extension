# CI workflow for the feature/3.0.x line (JDK 21)
#
# Triggers:
#   - push / pull_request on the feature/3.0.x branch
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=false) configured in the POM.
name: CI

on:
  push:
    branches: [feature/3.0.x]
  pull_request:
    branches: [feature/3.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 21 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Install vendored MtOpJavaSDK (libs/) into local repository
        run: |
          V=1.0-20260630.083612-1
          R=com/sankuai/sjst/MtOpJavaSDK/$V
          mkdir -p ~/.m2/repository/$R
          cp libs/MtOpJavaSDK-1.0-SNAPSHOT.jar ~/.m2/repository/$R/MtOpJavaSDK-$V.jar
          cp libs/MtOpJavaSDK-1.0-SNAPSHOT.pom ~/.m2/repository/$R/MtOpJavaSDK-$V.pom
          echo "===== settings.xml ====="
          cat ~/.m2/settings.xml || echo "no settings.xml"
          echo "===== CI 内解析复现 ====="
          cat > /tmp/resolve-pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>test</groupId><artifactId>resolve-test</artifactId><version>1.0</version>
            <dependencies>
              <dependency>
                <groupId>com.sankuai.sjst</groupId>
                <artifactId>MtOpJavaSDK</artifactId>
                <version>1.0-20260630.083612-1</version>
              </dependency>
            </dependencies>
            <repositories>
              <repository>
                <id>snap</id>
                <url>https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3</url>
                <releases><enabled>false</enabled></releases>
                <snapshots><enabled>true</enabled></snapshots>
              </repository>
            </repositories>
          </project>
          XML
          mvn -B -f /tmp/resolve-pom.xml dependency:resolve || true
          ls -la ~/.m2/repository/$R

      - name: Build and verify with JaCoCo coverage gate
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14
