# CI workflow for the feature/1.0.x line (JDK 8)
#
# Triggers:
#   - push / pull_request on the feature/1.0.x branch
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify javadoc:javadoc javadoc:test-javadoc` which includes the JaCoCo coverage gate
# (90% line coverage, haltOnFailure=false) configured in the POM.
name: CI

on:
  push:
    branches: [feature/1.0.x]
  pull_request:
    branches: [feature/1.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          server-id: 2624322-release-6F6h6R
          server-username: ALIYUN_PACKAGES_USERNAME
          server-password: ALIYUN_PACKAGES_PASSWORD

      - name: Build, verify, and check Javadoc
        env:
          ALIYUN_PACKAGES_USERNAME: ${{ secrets.ALIYUN_PACKAGES_USERNAME }}
          ALIYUN_PACKAGES_PASSWORD: ${{ secrets.ALIYUN_PACKAGES_PASSWORD }}
        run: ./mvnw -B --no-transfer-progress clean verify javadoc:javadoc javadoc:test-javadoc

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          if-no-files-found: error
          path: target/site/jacoco
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14


      - name: Upload Javadoc reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: javadoc-reports
          path: |
            target/reports/apidocs
            target/reports/testapidocs
          if-no-files-found: error
          retention-days: 14
